<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>镜译网页 Beta · 0.51.5</title>
  <link rel="stylesheet" href="./host.css">
  <style>
    :root { color-scheme: dark; font-family: system-ui, "Microsoft YaHei", sans-serif; background: #15171c; color: #eceff4; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at top, #252a32, #111318 58%); }
    .mock-toolbar { position: sticky; top: 0; display: flex; gap: 12px; align-items: center; padding: 14px 18px; border-bottom: 1px solid #343a45; background: #181b21; }
    .mock-toolbar h1 { margin: 0 auto 0 0; font-size: 17px; }
    #extensionsMenu { display: flex; gap: 8px; }
    .list-group-item, .menu_button { padding: 9px 12px; border: 1px solid #48505e; border-radius: 9px; background: #252b35; color: #eef1f6; cursor: pointer; }
    .mock-layout { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 18px; width: min(1200px, calc(100% - 32px)); margin: 24px auto; }
    .mock-card { padding: 20px; border: 1px solid #343a45; border-radius: 16px; background: #1b1f27; box-shadow: 0 18px 46px rgba(0,0,0,.22); }
    .mock-card h2 { margin-top: 0; font-size: 16px; }
    .mock-probe { display: grid; gap: 6px; margin-bottom: 16px; color: #aeb7c4; font-size: 13px; }
    .mock-probe input { box-sizing: border-box; width: 100%; height: 36px; padding: 7px 9px; border: 1px solid #48505e; border-radius: 7px; background: #12151a; color: #eef1f6; }
    #chat .mes_text { line-height: 1.8; color: #dce2ea; font-size: 15px; }
    /* The host keeps quote marks as text and suppresses the browser's own <q> quotes. */
    #chat q::before, #chat q::after { content: ''; }
    #chat q { color: #e2c08a; }
    .extension_container { padding: 13px; border: 1px solid #3a414d; border-radius: 12px; }
    .inline-drawer-header { display: flex; justify-content: space-between; }
    .beta-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .beta-actions button:disabled { opacity: .55; cursor: default; }
    .beta-note, #beta-status { color: #bfc9d7; font-size: 13px; }
    #chat bbi_image { display: block; padding: 10px 14px; border: 1px dashed #7886a0; border-radius: 8px; }
    #beta-raw { padding: 10px; white-space: pre-wrap; overflow-wrap: anywhere; background: #13161c; }
    @media (max-width: 760px) { .mock-layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header class="mock-toolbar">
    <h1>镜译网页 Beta · 0.51.5</h1>
    <div id="extensionsMenu" aria-label="魔法棒扩展菜单"></div>
  </header>
  <main class="mock-layout">
    <section class="mock-card">
      <h2>当前 AI 回复</h2>
      <div class="beta-actions">
        <button type="button" id="beta-translate" class="menu_button" disabled>开始翻译</button>
        <button type="button" id="beta-insert" class="menu_button" disabled>插入标签</button>
        <button type="button" id="beta-clear" class="menu_button" disabled>清除译文</button>
      </div>
      <p id="beta-status" role="status">正在加载示例…</p>
      <div id="chat"><div class="mes" mesid="0"><div class="mes_block"><div class="mes_text"></div></div></div></div>
      <details><summary>查看本楼原始内容</summary><pre id="beta-raw"></pre></details>
    </section>
    <aside class="mock-card">
      <div class="beta-actions">
        <button type="button" id="beta-fish-web-open" class="menu_button" disabled>Fish 管理</button>
        <button type="button" id="beta-workshop-open" class="menu_button" disabled>试用音色工坊</button>
      </div>
      <p class="beta-note" id="beta-entry-status" role="status"></p>
      <h2>扩展设置区</h2>
      <label class="mock-probe">宿主输入框样式探针<input id="host-style-probe" value="不应被扩展样式拉伸"></label>
      <div id="extensions_settings2"></div>
    </aside>
  </main>

  <script type="module">
    class MockEvents {
      constructor() { this.listeners = new Map(); }
      on(type, handler) { if (!this.listeners.has(type)) this.listeners.set(type, new Set()); this.listeners.get(type).add(handler); }
      removeListener(type, handler) { this.listeners.get(type)?.delete(handler); }
      async emit(type, ...args) { for (const handler of this.listeners.get(type) || []) await handler(...args); }
    }

    const eventTypes = {
      GENERATION_STARTED: 'generation_started',
      GENERATION_STOPPED: 'generation_stopped',
      GENERATION_ENDED: 'generation_ended',
      STREAM_TOKEN_RECEIVED: 'stream_token_received',
      CHARACTER_MESSAGE_RENDERED: 'character_message_rendered',
      MESSAGE_SWIPED: 'message_swiped',
      MESSAGE_EDITED: 'message_edited',
      MESSAGE_UPDATED: 'message_updated',
      CHAT_CHANGED: 'chat_changed',
      WORLDINFO_ENTRIES_LOADED: 'worldinfo_entries_loaded',
    };
    const eventSource = new MockEvents();
    const dialogueBeta = !new URLSearchParams(location.search).has('legacy');
    const original = dialogueBeta
      ? '<story_scene>\n窗外下着小雨，教室里只剩他们两个人。\n\n樱井转过身，轻声问：“明天还会来吗？”\n他点点头：「当然。我答应过你。」\n\n她笑了，把书包放回桌上。\n</story_scene>'
      : `<story_scene>\n夕暮れの教室には、誰もいなかった。\n窓から差し込む光が、机を淡く照らしている。\n\n桜井は振り返って、「来たんだね」と小さく笑った。\n\n「明日も、ここで会える？」\n「……うん。約束する」\n</story_scene>`;
    // Stand-in translations for the lines above, with the per-line speaker labels a model returns.
    const previewTranslations = new Map([
      ['“明天还会来吗？”', { text: '“Will you come again tomorrow?”', speaker: '樱井' }],
      ['「当然。我答应过你。」', { text: '「Of course. I promised you.」', speaker: '玩家' }],
      ['窗外下着小雨，教室里只剩他们两个人。', { text: 'Rain fell outside. They were alone in the classroom.' }],
      ['她笑了，把书包放回桌上。', { text: 'She smiled and put her bag back on the desk.' }],
      ['夕暮れの教室には、誰もいなかった。', { text: '傍晚的教室里，一个人也没有。' }],
      ['窓から差し込む光が、机を淡く照らしている。', { text: '从窗外照进来的光，淡淡地照着桌面。' }],
      ['桜井は振り返って、「来たんだね」と小さく笑った。', { text: '樱井回过头，「你来了啊」，轻轻笑了一下。', speaker: '樱井', emotion: 'happy', intensity: 1, direction: '平静叙述，句尾带一点暖意', quotes: [{ head: '你来了', speaker: '樱井', emotion: 'happy', intensity: 1, direction: '见到人就开心，声音亮起来，带一点笑', sounds: [{ at: 'end', tag: '轻笑' }] }] }],
      ['「明日も、ここで会える？」', { text: '「明天，也能在这里见面吗？」', speaker: '玩家', emotion: 'fear', intensity: 1, direction: '怕被拒绝的试探，压着期待，语速放慢', speed: 'slow', stress: ['见面'] }],
      ['「……うん。約束する」', { text: '「……嗯。我保证。」', speaker: '樱井', emotion: 'tender', intensity: 1, direction: '被打动后的轻声承诺，先叹一口气，尾音放软', volume: 'quiet', sounds: [{ at: 'start', tag: '叹气' }] }],
    ]);
    const chat = [{
      mes: original,
      name: 'Assistant',
      is_user: false,
      is_system: false,
      swipe_id: 0,
      swipes: [original],
      swipe_info: [{ extra: {} }],
      extra: {},
    }];
    // Roughly what the host's messageFormatting leaves in .mes_text, in the host's order: the display
    // regex scripts (boundary cleanup, hidden originals, bound beautify rules), quotes kept as text
    // inside <q>, blank-line paragraphs, and every class name prefixed with custom- by the sanitiser.
    const { compileNativeRegex } = await import('./processing.js');
    // The first render happens before the host context below exists, and before any rule is bound.
    const displayRules = () => {
      try { return context.extensionSettings.regex ?? []; } catch { return []; }
    };
    const applyDisplayRegex = mes => displayRules()
      .filter(rule => !rule.disabled && rule.markdownOnly && (rule.placement ?? []).includes(2))
      .reduce((text, rule) => {
        try { return text.replace(compileNativeRegex(rule.findRegex), rule.replaceString); } catch { return text; }
      }, mes);
    const tagsOnly = /^(?:\s*<[^<>]+>\s*)+$/;
    const formatMessage = mes => applyDisplayRegex(String(mes))
      .replace(/\n?\u2063\u200d\u2063[\s\S]*?\u2063\ufeff\u2063/g, '')
      .replace(/[\u200b-\u200d\u2060-\u2064\ufeff]/g, '')
      .replace(/<\/?story_scene>/g, '')
      .replace(/(「[^「」\n]*」|“[^“”\n]*”)/g, '<q>$1</q>')
      .split(/\n{2,}/)
      .map(block => block.trim())
      .filter(Boolean)
      .map(block => (tagsOnly.test(block) ? block.replace(/\n/g, '') : `<p>${block.replace(/\n/g, '<br>')}</p>`))
      .join('')
      .replace(/class="([^"]*)"/g, (_whole, names) => `class="${names.split(/\s+/).filter(Boolean).map(name => `custom-${name}`).join(' ')}"`);
    const renderChat = () => {
      document.querySelector('#chat .mes_text').innerHTML = formatMessage(chat[0].mes);
      document.querySelector('#beta-raw').textContent = chat[0].mes;
    };
    renderChat();
    let insertedImageTag = false;
    let previewRun = null;
    const sampleTag = '<bbi_image data-preview="late-insert">\n🖼 试用插图「这一段保留原样」。\n</bbi_image>';
    const thinkingMarker = '模拟思考标记';
    const translateButton = document.querySelector('#beta-translate');
    const insertButton = document.querySelector('#beta-insert');
    const clearButton = document.querySelector('#beta-clear');
    const status = document.querySelector('#beta-status');

    function waitForInsert() {
      const run = previewRun;
      if (!run || run.waited || insertedImageTag) return Promise.resolve();
      run.waited = true;
      insertButton.disabled = false;
      status.textContent = '翻译中，可插入标签。';
      return new Promise(resolve => {
        const done = () => {
          clearTimeout(timer);
          run.release = null;
          insertButton.disabled = true;
          resolve();
        };
        const timer = setTimeout(done, 9000);
        run.release = done;
      });
    }

    const originalFetch = globalThis.fetch.bind(globalThis);
    globalThis.fetch = async (input, init) => {
      const url = new URL(typeof input === 'string' || input instanceof URL ? input : input.url, location.href);
      if (url.pathname === '/api/backends/chat-completions/generate' && String(init?.body).includes('segments')) {
        await waitForInsert();
      }
      return originalFetch(input, init);
    };

    const translatePayload = prompt => {
      // A call (通话测试): the character answers, performing its lines by the 声学标注规则 when the call's
      // instructions carry them.
      const system = String((Array.isArray(prompt) ? prompt : []).find(item => item.role === 'system')?.content ?? '');
      if (system.includes('通电话')) {
        return system.includes('【声音】')
          ? '〔1〕喂？是我。〔3〕[snicker] 你又想我了吧？？〔2,slow〕[sigh] 好啦……我也想你。'
          : '喂？是我。你又想我了吧？好啦……我也想你。';
      }
      // The last user message is not always the input: a connection can carry a postscript, which
      // rides after everything else. What is wanted is the last one that parses as the request.
      const parsed = (Array.isArray(prompt) ? prompt : []).filter(item => item.role === 'user')
        .map(item => { try { return JSON.parse(item.content); } catch { return null; } })
        .filter(Boolean);
      const body = parsed.at(-1) ?? { segments: [{ id: 1 }] };
      // The read-aloud analysis: labels by id, the speaker taken from a name in the narration before a
      // quote, and a mood from the closing punctuation.
      if (body.task === 'refine_voices_for_audiobook') {
        // The stand-in director takes the note: whoever was named is now 樱井, everything else stands.
        const wanted = /说话人/.test(String(body.feedback ?? '')) ? '樱井' : null;
        const voices = (body.utterances ?? []).map((item, index) => (index === 0 && wanted
          ? { id: item.id, type: 'dialogue', speaker: wanted, emotion: 'nervous' }
          : { id: item.id }));
        return JSON.stringify({ voices });
      }
      if (body.task === 'label_utterances_for_audiobook' || body.task === 'sketch_voices_for_audiobook' || body.task === 'direct_voices_for_audiobook') {
        const deep = body.task === 'direct_voices_for_audiobook';
        // The floor arrives as paragraphs with every quoted run marked ⟦id⟧; only dialogue is answered.
        const runs = [];
        let lastName = '樱井';
        for (const line of body.lines ?? []) {
          const text = String(line.text ?? '');
          const named = (body.roster ?? []).find(name => text.includes(name));
          if (named) lastName = named;
          for (const match of text.matchAll(/⟦(\d+)⟧([^⟦]*)/g)) {
            const speaker = body.speakers?.[match[1]] ?? lastName;
            lastName = lastName === '樱井' ? '玩家' : '樱井';
            runs.push({ id: Number(match[1]), speaker, text: match[2] });
          }
        }
        const voices = runs.map(run => {
          const asking = /？」?/.test(run.text);
          const trailing = /……/.test(run.text);
          if (!deep) {
            return { id: run.id, speaker: run.speaker, emotion: asking ? 'nervous' : trailing ? 'tender' : 'happy' };
          }
          if (asking) return { id: run.id, speaker: run.speaker, emotion: 'nervous', tone: 'soft tone', speed: 'slow', volume: 'quiet', pauses: [{ after: '明天', length: 'short' }], stress: ['见面'], sounds: [{ at: 'start', tag: 'gasping' }] };
          if (trailing) return { id: run.id, speaker: run.speaker, emotion: 'tender', speed: 'slow', volume: 'quiet', sounds: [{ at: 'start', tag: 'sighing' }], stress: ['保证'] };
          return { id: run.id, speaker: run.speaker, emotion: 'happy', shifts: [{ at: '你', emotion: 'excited' }], sounds: [{ at: 'end', tag: 'chuckling' }] };
        });
        return JSON.stringify({ voices });
      }
      if (body.task === 'list_characters_from_worldbook') {
        return JSON.stringify({ characters: [{ name: '樱井', aliases: ['桜井'], lang: 'ja' }, { name: '老胡', aliases: [] }] });
      }
      const translations = body.segments.map(item => {
        const known = previewTranslations.get(item.text);
        return known ? { id: item.id, ...known } : { id: item.id, text: `{第${item.id}段\n中文镜像}` };
      }).reverse();
      return `模型说明会被忽略\n\`\`\`json\n${JSON.stringify({ translations })}\n\`\`\``;
    };
    const modelReply = async prompt => {
      const answer = translatePayload(prompt);
      if (!answer.includes('"translations"')) return answer;
      await waitForInsert();
      return `<think>${thinkingMarker}</think>\n${answer}`;
    };
    const context = {
      chat,
      chatId: 'preview-chat',
      name1: '玩家',
      name2: '樱井',
      characterId: 0,
      groupId: null,
      maxContext: 8192,
      characters: [{ name: '樱井', description: '旅行者。', personality: '平静。', scenario: '王都。' }],
      eventSource,
      eventTypes,
      extensionSettings: {
        disabledExtensions: [],
        'jingyi-translator': {
          excludedTags: ['bbi_image', 'image_prompt'],
          translationScope: dialogueBeta ? 'dialogue' : 'all',
          autoGeneration: false,
          tts: {
            enabled: true, autoRead: false, autoGenerate: false, fish: { key: 'preview-key' },
          },
        },
        connectionManager: {
          profiles: [{ id: 'preview-profile', name: '副 API 测试配置', model: 'translator-model', api: 'openai' }],
        },
      },
      saveSettingsDebounced() {},
      getRequestHeaders() { return { 'Content-Type': 'application/json', 'X-CSRF-Token': 'preview-token' }; },
      substituteParams(value) { return value; },
      async getWorldInfoPrompt() {
        // The host reports its sorted entries on every scan; the reading page's cast import reads them.
        await eventSource.emit('worldinfo_entries_loaded', {
          globalLore: [
            { world: '预览', uid: 1, comment: '樱井', key: ['桜井', '樱井'], content: '{{char}}，安静的同学，说话很轻。' },
            { world: '预览', uid: 2, comment: '老胡', key: ['老胡'], content: '小卖部老板。' },
            { world: '预览', uid: 3, comment: '教室设定', key: ['教室'], content: '没有空调。' },
          ],
          characterLore: [], chatLore: [], personaLore: [],
        });
        return { worldInfoBefore: '桜井的中文写法是樱井。', worldInfoAfter: '' };
      },
      async saveChat() {},
      updateMessageBlock() { renderChat(); },
      getCurrentChatId() { return 'preview-chat'; },
      async generateRaw({ prompt }) {
        return modelReply(prompt);
      },
      ChatCompletionService: {
        async processRequest(payload) { return { content: await modelReply(payload.messages), reasoning: '' }; },
      },
    };
    globalThis.toastr = {
      success(message, title) { console.info(`${title}: ${message}`); },
      error(message, title) { console.error(`${title}: ${message}`); },
      info(message, title) { console.info(`${title}: ${message}`); },
    };
    globalThis.SillyTavern = { getContext: () => context };
    const workshopButton = document.querySelector('#beta-workshop-open');
    const entryStatus = document.querySelector('#beta-entry-status');
    try {
      const response = await fetch('/preview/workshop/session', { method: 'POST' });
      const session = await response.json();
      if (!response.ok || !session.ok) throw new Error('模拟工坊暂时连不上。');
      localStorage.setItem('jingyi.workshop.api', session.base);
      localStorage.setItem('jingyi.workshop.session.v1', JSON.stringify(session));
      workshopButton.disabled = false;
    } catch {
      entryStatus.textContent = '模拟工坊连接失败。';
    }
    const extension = await import('./index.js');
    await extension.onActivate();
    if (dialogueBeta) {
      const settings = context.extensionSettings['jingyi-translator'];
      const { getActivePromptProfile } = await import('./core.js');
      getActivePromptProfile(settings).targetLanguage = 'English';
    }
    const delay = ms => new Promise(resolve => setTimeout(resolve, ms));
    translateButton.disabled = false;
    clearButton.disabled = false;
    status.textContent = dialogueBeta ? '示例已就绪 · 只翻译对白' : '示例已就绪 · 全文翻译';
    translateButton.addEventListener('click', async () => {
      if (previewRun) return;
      previewRun = {};
      translateButton.disabled = true;
      clearButton.disabled = true;
      status.textContent = '正在启动模拟翻译…';
      try {
        const result = await extension.__testing.startTranslation(0, { force: true });
        const tagState = insertedImageTag
          ? (chat[0].mes.includes(sampleTag) ? '标签块完整保留。' : '没有在写回内容里找到完整标签块。')
          : '本次没有插入标签。';
        status.textContent = result?.skipped ? `本次未写入译文（${result.reason}）。` : `翻译完成。${tagState}`;
        if (chat[0].mes.includes(thinkingMarker)) status.textContent += ' 检测到模拟思考内容混入。';
      } catch (error) {
        status.textContent = error.message;
      } finally {
        previewRun?.release?.();
        previewRun = null;
        translateButton.disabled = false;
        clearButton.disabled = false;
      }
    });
    insertButton.addEventListener('click', () => {
      if (!previewRun?.release || insertedImageTag) return;
      insertedImageTag = true;
      const point = chat[0].mes.indexOf('\n他点点头：');
      const at = point < 0 ? chat[0].mes.lastIndexOf('</story_scene>') : point;
      chat[0].mes = chat[0].mes.slice(0, at) + `\n\n${sampleTag}\n\n` + chat[0].mes.slice(at);
      chat[0].swipes[0] = chat[0].mes;
      renderChat();
      void eventSource.emit(eventTypes.MESSAGE_EDITED, 0);
      status.textContent = '已插入标签，等译文写回。';
      previewRun.release();
    });
    clearButton.addEventListener('click', async () => {
      try {
        const result = await extension.__testing.clearFloorTranslation(0);
        const kept = insertedImageTag && chat[0].mes.includes(sampleTag);
        status.textContent = result.cleared ? (kept ? '译文已清除，插入标签仍在。' : '译文已清除。') : '这楼没有需要清除的译文。';
      } catch (error) {
        status.textContent = error.message;
      }
    });
    async function openPreviewTab(selector) {
      document.querySelector('#jingyi-translator-menu-entry')?.click();
      for (let attempt = 0; attempt < 30; attempt += 1) {
        const panel = document.querySelector('#jingyi-translator-panel-host')?.shadowRoot;
        const tab = panel?.querySelector(selector);
        if (tab) {
          tab.click();
          return { panel, page: tab.dataset.jyTab };
        }
        await delay(60);
      }
      return null;
    }

    const fishWebButton = document.querySelector('#beta-fish-web-open');
    fishWebButton.disabled = false;
    fishWebButton.addEventListener('click', async () => {
      if (!await openPreviewTab('[data-jy-tab="fish-center"]')) entryStatus.textContent = 'Fish 管理打开失败。';
    });
    workshopButton.addEventListener('click', async () => {
      const target = await openPreviewTab('[data-jy-tab="finetune"]:not([hidden]), [data-jy-tab="tts"]:not([hidden])');
      const entry = target?.panel.querySelector(`[data-jy-page="${target.page}"] [data-jy-ws-go="workshop"]`);
      if (!entry) { entryStatus.textContent = '音色工坊打开失败。'; return; }
      const fold = entry.closest('details');
      if (fold) fold.open = true;
      entry.click();
    });
    globalThis.__JINGYI_PREVIEW__ = { context, extension };
  </script>
</body>
</html>
