<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "PingFang SC","Microsoft YaHei UI","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif; }
    a { color: #255d4e; text-decoration: none; }
    a:hover { color: #1a463b; }
  </style>
</helmet>

<div style="position: relative; width: 820px; height: 700px; background: #15171c; overflow: hidden; font-size: 13px; line-height: 1.7;">

  <div style="padding: 22px 26px; color: #8d97a5; font-size: 12px;">
    <div style="color: #c7cedb; font-size: 13px; font-weight: 600; padding-bottom: 12px;">SillyTavern 聊天区</div>
    <div style="color: #7b8595; line-height: 2;">夕暮れの教室には、誰もいなかった。<br>窓から差し込む光が、机を淡く照らしている。</div>
    <div style="color: #566072; line-height: 2; padding-top: 10px;">「明日も、ここで会える？」</div>
    <div style="color: #4a5364; font-size: 11px; padding-top: 18px;">悬浮窗浮在聊天之上，不占据酒馆布局；拖动标题栏移动，位置记在本机。</div>
  </div>

  <div style="position: absolute; right: 26px; bottom: 26px; width: 344px; border-radius: 13px; background: #fffdf7; border: 1px solid #cfd5c8; box-shadow: 0 20px 52px rgba(4, 14, 11, .55); overflow: hidden;">

    <div style="display: flex; align-items: center; gap: 9px; padding: 10px 12px; background: #163a30; color: #e7eee3;">
      <div style="display: grid; place-items: center; width: 22px; height: 24px; flex: 0 0 auto; border: 1px solid rgba(145,173,150,.5); border-radius: 3px 8px 3px 3px; color: #e2cf9c; font-family: Georgia,'Songti SC',serif; font-size: 14px;">镜</div>
      <div style="flex-grow: 1; min-width: 0; display: flex; align-items: center; gap: 7px;">
        <span style="font-weight: 700; letter-spacing: .1em; font-size: 13px;">镜译</span>
        <span style="width: 6px; height: 6px; border-radius: 50%; background: #f0c56e;"></span>
      </div>
      <div style="display: grid; place-items: center; width: 24px; height: 24px; border-radius: 5px; color: #a9c0b2;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"/><path d="M20 4l-8 8"/><path d="M18 15v3a2 2 0 01-2 2H6a2 2 0 01-2-2V8a2 2 0 012-2h3"/></svg>
      </div>
      <div style="display: grid; place-items: center; width: 24px; height: 24px; border-radius: 5px; color: #a9c0b2;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 12h12"/></svg>
      </div>
    </div>

    <div style="padding: 13px 14px 14px;">

      <div style="display: flex; flex-direction: column; gap: 7px;">
        <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 10px;">
          <div style="font-size: 14px; font-weight: 650;">第 42 楼 · 正在翻译</div>
          <div style="color: #6b7770; font-size: 11px;">24 / 37 行</div>
        </div>
        <div style="height: 4px; border-radius: 3px; background: #e7ede2; overflow: hidden;">
          <div style="width: 65%; height: 100%; background: #255d4e;"></div>
        </div>
      </div>

      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; padding-top: 12px;">
        <div style="display: flex; align-items: center; justify-content: center; gap: 5px; height: 32px; border: 1px solid #d8dccf; border-radius: 6px; font-size: 12px; font-weight: 600;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M20 11a8 8 0 10-2 6"/><path d="M20 5v6h-6"/></svg>
          <span>重译</span>
        </div>
        <div style="display: flex; align-items: center; justify-content: center; gap: 5px; height: 32px; border: 1px solid #d8dccf; border-radius: 6px; font-size: 12px; font-weight: 600; color: #b54332;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="7" y="7" width="10" height="10" rx="1.6"/></svg>
          <span>停止</span>
        </div>
        <div style="display: flex; align-items: center; justify-content: center; gap: 5px; height: 32px; border: 1px solid #d8dccf; border-radius: 6px; font-size: 12px; font-weight: 600;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M6 11l6 6 6-6"/></svg>
          <span>刷新楼层</span>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 7px; margin-top: 13px; padding-top: 13px; border-top: 1px solid #ebeade;">
        <div style="display: flex; align-items: center; gap: 8px;">
          <div style="width: 34px; flex: 0 0 auto; color: #6b7770; font-size: 11px; font-weight: 600;">模型</div>
          <div style="flex-grow: 1; min-width: 0; display: flex; align-items: center; justify-content: space-between; height: 30px; padding: 0 10px; border: 1px solid #d8dccf; border-radius: 6px; background: #fffef9; font-weight: 600;">
            <span>translator-pro</span>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#6b7770" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
          </div>
        </div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <div style="width: 34px; flex: 0 0 auto; color: #6b7770; font-size: 11px; font-weight: 600;">方案</div>
          <div style="flex-grow: 1; min-width: 0; display: flex; align-items: center; justify-content: space-between; height: 30px; padding: 0 10px; border: 1px solid #d8dccf; border-radius: 6px; background: #fffef9; font-weight: 600;">
            <span>中文轻小说</span>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#6b7770" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
          </div>
        </div>
      </div>

      <div style="margin-top: 13px; padding-top: 13px; border-top: 1px solid #ebeade;">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-bottom: 8px;">
          <div style="font-weight: 650;">随手翻</div>
          <div style="display: flex; align-items: center; gap: 5px; padding: 2px 8px; border: 1px solid #d8dccf; border-radius: 20px; font-size: 11px; font-weight: 600;">
            <span>简体中文</span>
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#6b7770" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
          </div>
        </div>

        <div style="padding: 9px 11px; border: 1px solid #d8dccf; border-radius: 7px; background: #fffef9; color: #33443d; line-height: 1.8;">返事をする代わりに、僕は小さく頷いた。</div>

        <div style="display: flex; align-items: center; gap: 7px; padding-top: 8px;">
          <div style="display: flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 14px; border-radius: 6px; background: #255d4e; color: #fffef3; font-size: 12px; font-weight: 650;">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13"/><path d="M13 6l6 6-6 6"/></svg>
            <span>翻译这段</span>
          </div>
          <div style="color: #8b958c; font-size: 11px;">用当前方案与模型，不写回楼层</div>
        </div>

        <div style="margin-top: 9px; padding: 10px 11px; border: 1px solid #dfe3d5; border-radius: 7px; background: #eef1e7;">
          <div style="color: #33443d; line-height: 1.85;">我没有回答，只是轻轻点了点头。</div>
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 8px; padding-top: 8px; border-top: 1px solid #dfe3d5;">
            <div style="color: #8b958c; font-size: 11px;">1.6 秒 · translator-pro</div>
            <div style="display: flex; align-items: center; gap: 5px; color: #255d4e; font-size: 11px; font-weight: 650;">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 9h11v11H9z"/><path d="M15 5H4v11"/></svg>
              <span>复制</span>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

</div>
</x-dc>
</body>
</html>
